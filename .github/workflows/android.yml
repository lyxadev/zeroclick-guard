name: Android

on:
  push:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"

jobs:
  build:
    name: Build .so + assemble APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;${NDK_VERSION}"

      - name: Add Rust Android targets
        run: rustup target add x86_64-linux-android aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build zcg-core for Android (.so)
        working-directory: android/rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          cargo ndk -t x86_64 -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: List built libraries
        run: find android/app/src/main/jniLibs -name "*.so" -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeroclick-guard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  emulator-test:
    name: On-device proof (emulator)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;${NDK_VERSION}"

      - name: Add Rust Android target (x86_64 for the emulator)
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build zcg-core for the emulator ABI (.so)
        working-directory: android/rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          cargo ndk -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace
